name: Validate repository artifacts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight validators
        run: python -m pip install --upgrade nbformat

      - name: Validate notebook JSON and code syntax
        run: |
          python - <<'PY'
          import ast
          import nbformat
          from pathlib import Path

          notebook = Path("aki_ssl_survival_sectioned_workflow_clinical_deployment_gated_v4_d_drive_publication.ipynb")
          nb = nbformat.read(notebook, as_version=4)
          nbformat.validate(nb)
          errors = []
          for idx, cell in enumerate(nb.cells):
              if cell.cell_type != "code":
                  continue
              source = "\n".join(
                  line for line in cell.source.splitlines()
                  if not line.lstrip().startswith(("%", "!"))
              )
              try:
                  ast.parse(source)
              except SyntaxError as exc:
                  errors.append((idx, exc.lineno, exc.msg))
          if errors:
              raise SystemExit(f"Notebook syntax errors: {errors}")
          print(f"Validated {len(nb.cells)} notebook cells")
          PY

      - name: Check repository safety policy files
        run: |
          test -f README.md
          test -f DATA_ACCESS.md
          test -f SECURITY.md
          test -f requirements.txt
